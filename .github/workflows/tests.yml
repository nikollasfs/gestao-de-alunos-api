name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env para os testes
        run: |
          echo "MONGODB_URI=mongodb://127.0.0.1:27017/gestao-de-alunos-test" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> .env
          echo "ADMIN_SENHA=${{ secrets.ADMIN_SENHA }}" >> .env
          echo "ALUNO_EMAIL=${{ secrets.ALUNO_EMAIL }}" >> .env
          echo "ALUNO_SENHA=${{ secrets.ALUNO_SENHA }}" >> .env
          echo "TEST_STUDENT_SENHA=${{ secrets.TEST_STUDENT_SENHA }}" >> .env
          echo "ADMIN_INVALID_SENHA=${{ secrets.ADMIN_INVALID_SENHA }}" >> .env

      - name: Executar testes
        run: npm test
